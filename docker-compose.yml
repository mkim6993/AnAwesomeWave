services:
  postgres:
    image: postgres:16
    container_name: awesome_wave_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: awesome_user
      POSTGRES_PASSWORD: awesome_pass
      POSTGRES_DB: awesome_wave
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
